<!DOCTYPE html>
<!-- Main document: shows the login screen or the app depending on the session. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A.I.M. helps turn goals into manageable actions and visible progress.">
  <title>A.I.M. — Action, Intention, Momentum</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  {% if username %}
  {% include "components/app-shell.html" %}
  {% include "components/modals.html" %}
  {% include "components/empty-state.html" %}
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% else %}
  {% include "components/auth.html" %}
  <script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
  {% endif %}
</body>
</html>
