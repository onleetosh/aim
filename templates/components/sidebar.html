<!-- Persistent branding, navigation, and progress summary. -->
<aside class="sidebar">
  <a class="brand" href="#" aria-label="A.I.M. home">
    <span class="brand-mark">A</span>
    <span>
      <strong>A.I.M.</strong>
      <small>Action, Intention, Momentum</small>
    </span>
  </a>

  <nav class="main-nav" aria-label="Main navigation">
    <button class="nav-item" type="button" data-view="dashboard">
      <span aria-hidden="true">◈</span> Dashboard
    </button>
    <button class="nav-item active" type="button" data-view="board">
      <span aria-hidden="true">▦</span> My board
    </button>
    <button class="nav-item" type="button" data-view="goals">
      <span aria-hidden="true">◎</span> Goals
    </button>
    <button class="nav-item" type="button" data-view="analytics">
      <span aria-hidden="true">▤</span> Progress
    </button>
    <button class="nav-item" type="button" data-view="focus">
      <span aria-hidden="true">◉</span> Time Tracking
    </button>
  </nav>

  <div class="account">
    <span class="account-name" title="Signed in as {{ username }}">{{ username }}</span>
    <button class="text-button" id="logout-button" type="button">Log out</button>
  </div>

  <div class="sidebar-footer">
    <p class="sidebar-label">Your momentum</p>
    <div class="momentum-card">
      <div class="momentum-value"><strong id="momentum-percent">0%</strong><span>complete</span></div>
      <div class="progress-track"><span id="momentum-bar"></span></div>
      <p><span id="completed-count">0</span> of <span id="total-count">0</span> tasks finished</p>
    </div>
    <p class="sidebar-note">Small steps count. Keep moving forward.</p>
  </div>
</aside>
