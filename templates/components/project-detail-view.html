<section class="view hidden" id="project-detail-view" aria-labelledby="project-detail-heading">
  <button class="back-button" id="back-to-projects" type="button">← Back to projects</button>
  <div class="project-detail-header">
    <div>
      <p class="eyebrow">Project details</p>
      <h2 id="project-detail-heading"></h2>
      <p class="project-description" id="project-detail-description"></p>
    </div>
    <button class="primary-button" id="project-new-task-button" type="button"><span aria-hidden="true">+</span> New task</button>
  </div>
  <div class="project-summary" id="project-summary"></div>
  <div class="project-task-groups" id="project-task-groups"></div>
</section>
