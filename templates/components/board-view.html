<!-- Kanban board containers are populated by the JavaScript renderer. -->
<section class="view" id="board-view" aria-labelledby="board-heading">
  <div class="section-heading">
    <div>
      <p class="eyebrow">Your focus space</p>
      <h2 id="board-heading">What needs your attention?</h2>
    </div>
    <label class="project-filter">Filter project
      <select id="project-filter">
        <option value="all">All projects</option>
      </select>
    </label>
  </div>
  <div class="board" id="board"></div>
</section>
